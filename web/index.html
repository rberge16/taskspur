<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taktspur</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b172a'/%3E%3Cpath d='M5 19h5l2-8 4 14 3-10 2 4h6' fill='none' stroke='%236ee7b7' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <header class="topbar">
    <div class="brand">Taktspur</div>

      <button type="button" data-view="calendar">Kalender</button>
      <button type="button" data-view="activities">Aktivitäten</button>
      <button type="button" data-view="plans">Pläne</button>
      <button type="button" data-view="settings">Einstellungen</button>
